rules:
  - id: traust-python-cryptography-requests-verify-false
    languages: [python]
    severity: ERROR
    message: >-
      TLS certificate verification disabled on an outbound request — an
      on-path attacker can read or rewrite the exchange. Pin the expected
      CA bundle instead. CWE-295.
    metadata:
      cwe: ["CWE-295"]
      category: cryptography
      asvs: ["V12"]
      confidence: HIGH
      references:
        - "CWE-295 certificate validation — TLS verify disabled"
    patterns:
      - pattern-either:
          - pattern: requests.$F(..., verify=False, ...)
          - pattern: $SESSION.verify = False
          - pattern: httpx.$F(..., verify=False, ...)

  - id: traust-python-cryptography-ssl-wrap-socket
    languages: [python]
    severity: ERROR
    message: >-
      ssl.wrap_socket() performs no certificate-chain validation and no
      hostname checking (CERT_NONE default) — 'TLS' without
      authentication — and was removed in Python 3.12. Use
      ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT).wrap_socket(sock,
      server_hostname=host) so default verification applies. CWE-295.
    metadata:
      cwe: ["CWE-295"]
      category: cryptography
      asvs: ["V12"]
      confidence: HIGH
      references:
        - "CWE-295 — deprecated ssl.wrap_socket without certificate validation"
    patterns:
      - pattern-either:
          - pattern: ssl.wrap_socket
          - pattern: ssl.wrap_socket(...)

  - id: traust-python-cryptography-insecure-dsn-transport
    languages: [python]
    severity: ERROR
    message: >-
      A database connection string is built with TLS disabled or
      unverified (sslmode=disable/allow/prefer, mysql ssl-mode=DISABLED
      or tls=false) — queries and credentials cross the network in
      plaintext or without server authentication. Default to verify-full
      and make any insecure mode an explicit, documented opt-out.
      CWE-319.
    metadata:
      cwe: ["CWE-319"]
      category: cryptography
      asvs: ["V12"]
      confidence: HIGH
      references:
        - "CWE-319 — database DSN with TLS disabled or unverified"
    patterns:
      - pattern-regex: (?i)sslmode=(disable|allow|prefer)|[?&]tls=(false|skip-verify)|ssl-mode=disabled

  # v1.8 crypto-hygiene tranche. Ordinary
  # equality on secret material short-circuits at the first differing
  # byte, so response timing leaks how much of a guess was right. Name-
  # based by necessity (no type information), so confidence is LOW and the
  # judge decides: comparisons against literals/None, and names that
  # describe a secret's metadata (type, id, name, length, url, version...)
  # are excluded.
  - id: traust-python-cryptography-secret-compare-not-constant-time
    languages: [python]
    severity: WARNING
    message: >-
      Secret material (a token, password, digest, signature, MAC or API
      key) is compared with == / != — the comparison returns as soon as
      one byte differs, so timing reveals how much of a guessed value was
      correct. Compare with hmac.compare_digest (or secrets.compare_digest)
      on bytes of equal type. Confirm the operand really is secret: names
      are a heuristic. CWE-208.
    metadata:
      cwe: ["CWE-208"]
      category: cryptography
      asvs: ["V11"]
      confidence: LOW
      references:
        - "seeded defect shape: non-constant-time credential comparison"
    patterns:
      - pattern-not-inside: assert ...
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $A == $B
                  - pattern: $A != $B
              - metavariable-regex:
                  metavariable: $A
                  regex: '(?i)^(?:[A-Za-z_]\w*\.)*(?!err)(?!(?-i:[A-Z][A-Z0-9_]*)$)(?!\w*?_?(?:type|types|name|names|id|ids|url|uri|path|file|len|length|size|count|version|algorithm|algo|alg|kind|format|scheme|ref|header|endpoint|expiry|expires|expiration|ttl|duration|prefix|field|source|provider|issuer|audience|scope|scopes|status|state|policy|mode|method|config|cfg|options|enabled|required|present|valid|class|cls|hint|hints|label|keyid|dict|list|map|set|store|cache|manager|handler|client|service|backend|usage)$)(?!\w*(?:tokens|secrets|passwords|signatures)$)(?!(?:order|attribute|lexer|lex|parse|parser|next|prev|previous|current|cur|completion|prompt|input|output|max|num|total|start|end|stop|bos|eos|pad|special)_?token)(?:\w*?(?:token|secret|passw(?:or)?d|signature|hmac|api_?key)\w*|\w*?(?:hmac|mac|sig|secret)_?digest\w*|(?:\w*_)?mac|\w*[a-z0-9](?-i:Mac|MAC))$'
              # drop presence/kind/error checks: the other side is a literal,
              # sentinel, enum label or a type/kind-named value
              - metavariable-pattern:
                  metavariable: $B
                  patterns:
                    - pattern: $OTHER
                    - pattern-not: '"..."'
                    - pattern-not: b"..."
                    - pattern-not: None
                    - pattern-not: "True"
                    - pattern-not: "False"
                    - pattern-not: "[]"
                    - pattern-not: "{}"
                    - pattern-not-regex: '^-?\d+(\.\d+)?$'
                    - pattern-not-regex: '(?i)^(?:[\w.]+\.)?\w*(?:type|kind|status|state|mode|algorithm|algo|alg|version|format)$'
                    - pattern-not-regex: '(?i)^(?:[\w.]+\.)?err\w*$'
                    - pattern-not-regex: '^(?:[\w.]+\.)?[A-Z][A-Z0-9_]*$'
          - patterns:
              - pattern-either:
                  - pattern: $A == $B
                  - pattern: $A != $B
              - metavariable-regex:
                  metavariable: $B
                  regex: '(?i)^(?:[A-Za-z_]\w*\.)*(?!err)(?!(?-i:[A-Z][A-Z0-9_]*)$)(?!\w*?_?(?:type|types|name|names|id|ids|url|uri|path|file|len|length|size|count|version|algorithm|algo|alg|kind|format|scheme|ref|header|endpoint|expiry|expires|expiration|ttl|duration|prefix|field|source|provider|issuer|audience|scope|scopes|status|state|policy|mode|method|config|cfg|options|enabled|required|present|valid|class|cls|hint|hints|label|keyid|dict|list|map|set|store|cache|manager|handler|client|service|backend|usage)$)(?!\w*(?:tokens|secrets|passwords|signatures)$)(?!(?:order|attribute|lexer|lex|parse|parser|next|prev|previous|current|cur|completion|prompt|input|output|max|num|total|start|end|stop|bos|eos|pad|special)_?token)(?:\w*?(?:token|secret|passw(?:or)?d|signature|hmac|api_?key)\w*|\w*?(?:hmac|mac|sig|secret)_?digest\w*|(?:\w*_)?mac|\w*[a-z0-9](?-i:Mac|MAC))$'
              # drop presence/kind/error checks: the other side is a literal,
              # sentinel, enum label or a type/kind-named value
              - metavariable-pattern:
                  metavariable: $A
                  patterns:
                    - pattern: $OTHER
                    - pattern-not: '"..."'
                    - pattern-not: b"..."
                    - pattern-not: None
                    - pattern-not: "True"
                    - pattern-not: "False"
                    - pattern-not: "[]"
                    - pattern-not: "{}"
                    - pattern-not-regex: '^-?\d+(\.\d+)?$'
                    - pattern-not-regex: '(?i)^(?:[\w.]+\.)?\w*(?:type|kind|status|state|mode|algorithm|algo|alg|version|format)$'
                    - pattern-not-regex: '(?i)^(?:[\w.]+\.)?err\w*$'
                    - pattern-not-regex: '^(?:[\w.]+\.)?[A-Z][A-Z0-9_]*$'

  - id: traust-python-cryptography-weak-hash
    languages: [python]
    severity: INFO
    message: >-
      MD5/SHA-1 in use — fine for non-security checksums, broken for
      anything an attacker benefits from colliding (signatures, password
      hashes, integrity of untrusted input). Judge the context; hash
      passwords with a password KDF (argon2, bcrypt, scrypt). CWE-328.
    metadata:
      cwe: ["CWE-328", "CWE-327"]
      category: cryptography
      asvs: ["V11"]
      confidence: LOW
      references:
        - "CWE-328/CWE-327 — weak hash algorithms in security context"
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.new("md5", ...)
          - pattern: hashlib.new("sha1", ...)
      - pattern-not: hashlib.md5(..., usedforsecurity=False, ...)
      - pattern-not: hashlib.sha1(..., usedforsecurity=False, ...)

  - id: traust-python-cryptography-weak-random-secret
    languages: [python]
    severity: WARNING
    message: >-
      The random module's output assigned to a secret-looking variable —
      random is a seedable Mersenne Twister, so generated tokens, codes and
      passwords are predictable. Use the secrets module
      (secrets.token_urlsafe, secrets.choice). CWE-338.
    metadata:
      cwe: ["CWE-338"]
      category: cryptography
      asvs: ["V11"]
      confidence: MEDIUM
      references:
        - "CWE-338 — random module used for secret-shaped values"
    patterns:
      - pattern-either:
          - pattern: $X = random.$F(...)
          - pattern: $X = "...".join(random.$F(...))
          - pattern: $X = "".join(random.$F(...) for $I in $R)
      - metavariable-regex:
          metavariable: $F
          regex: ^(random|randint|randrange|choice|choices|sample|getrandbits)$
      - metavariable-regex:
          metavariable: $X
          regex: (?i).*(token|secret|password|passwd|nonce|otp|apikey|api_key|sessionid|session_id|reset_code|verification_code).*
