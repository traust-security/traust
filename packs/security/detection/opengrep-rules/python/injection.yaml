rules:
  - id: traust-python-injection-subprocess-shell
    languages: [python]
    severity: ERROR
    message: >-
      Shell execution with a run-time-composed command string — any
      interpolated value becomes shell syntax. Use an argument list with
      shell=False. CWE-78.
    metadata:
      cwe: ["CWE-78"]
      category: injection
      asvs: ["V1"]
      confidence: HIGH
      references:
        - "CWE-78 OS command injection — shell=True with dynamic command"
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ..., shell=True, ...)
          - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
          - pattern: subprocess.call($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
          - pattern: os.system($CMD)
      - metavariable-pattern:
          metavariable: $CMD
          patterns:
            - pattern-not: '"..."'

  - id: traust-python-injection-request-to-shell-taint
    languages: [python]
    severity: ERROR
    message: >-
      Request-derived value reaches a shell/subprocess call — the caller
      controls command content. Validate strictly and pass an argument
      vector. CWE-78.
    metadata:
      cwe: ["CWE-78"]
      category: injection
      asvs: ["V1"]
      confidence: HIGH
      references:
        - "CWE-78 OS command injection — shell=True with dynamic command"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: request.args.get(...)
          - pattern: request.args[...]
          - pattern: request.form.get(...)
          - pattern: request.form[...]
          - pattern: request.json[...]
    pattern-sinks:
      - pattern-either:
          - pattern: subprocess.run(...)
          - pattern: subprocess.Popen(...)
          - pattern: subprocess.call(...)
          - pattern: subprocess.check_output(...)
          - pattern: os.system(...)

  - id: traust-python-injection-raw-sql-taint
    languages: [python]
    severity: ERROR
    message: >-
      Request-derived value reaches a raw SQL execution point — string
      SQL built from user input is injectable regardless of the ORM
      around it. Use parameterized queries (execute(sql, params)) or ORM
      lookups. CWE-89.
    metadata:
      cwe: ["CWE-89"]
      category: injection
      asvs: ["V5"]
      confidence: HIGH
      references:
        - "CWE-89 SQL injection — request-derived raw SQL execution"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: request.GET.get(...)
          - pattern: request.GET[...]
          - pattern: request.POST.get(...)
          - pattern: request.POST[...]
          - pattern: request.data[...]
          - pattern: request.query_params.get(...)
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
    pattern-sinks:
      - pattern-either:
          - pattern: $CURSOR.execute($SQL)
          - pattern: $CURSOR.executemany($SQL)
          - pattern: RawSQL(...)
          - pattern: $QS.raw(...)
          - pattern: $QS.extra(...)

  - id: traust-python-injection-jinja2-template-taint
    languages: [python]
    severity: ERROR
    message: >-
      Request-derived value is compiled as a Jinja2 template outside a
      sandbox — template injection executes attacker expressions
      server-side (lookup/attribute chains reach os and subprocess).
      Render user data as a VARIABLE, or use
      jinja2.sandbox.ImmutableSandboxedEnvironment when user-authored
      templates are a feature. CWE-1336.
    metadata:
      cwe: ["CWE-1336", "CWE-94"]
      category: injection
      asvs: ["V5"]
      confidence: HIGH
      references:
        - "CWE-1336/CWE-94 — request-derived Jinja2 template compilation"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: request.GET.get(...)
          - pattern: request.POST.get(...)
          - pattern: request.data[...]
          - pattern: request.args.get(...)
          - pattern: request.form.get(...)
          - pattern: request.json[...]
    pattern-sinks:
      - pattern-either:
          - pattern: jinja2.Template(...)
          - pattern: jinja2.Environment(...).from_string(...)

  # v1.8 ownership-resolution tranche. A LIKE/ILIKE pattern assembled from
  # a run-time value leaves `_` and `%` in that value live as wildcards, so
  # a lookup meant as "objects owned by X" also returns objects owned by
  # names X matches. Primary CWE-155 (improper neutralization of wildcards
  # or matching symbols) names the exact mechanism; CWE-943 (improper
  # neutralization in data query logic) is the broader class. The value
  # need not be request-derived: a self-chosen account or namespace name
  # is enough, so this is a pattern rule, not a taint rule.
  - id: traust-python-injection-like-wildcard-unescaped
    languages: [python]
    severity: WARNING
    message: >-
      A LIKE/ILIKE pattern is built from a run-time value without escaping
      `%` and `_` — wildcard characters in the value widen the match, so a
      lookup scoped to one owner or prefix can return rows that belong to
      others (names commonly allow `_`). Escape the value (`\`, `%`, `_`)
      and pass an ESCAPE clause or the ORM's escape argument, or match on
      an exact key or foreign key instead of a name pattern. CWE-155.
    metadata:
      cwe: ["CWE-155", "CWE-943"]
      category: injection
      asvs: ["V1"]
      confidence: MEDIUM
      references:
        - "seeded defect shape: ownership resolved by an unescaped name pattern"
    pattern-either:
      # ORM pattern operators: SQLAlchemy like/ilike, peewee ** (ILIKE)
      - patterns:
          - pattern-either:
              - pattern: $COL.like($P, ...)
              - pattern: $COL.ilike($P, ...)
              - pattern: $COL.not_like($P, ...)
              - pattern: $COL.not_ilike($P, ...)
              - pattern: $COL ** $P
          - metavariable-pattern:
              metavariable: $P
              patterns:
                - pattern-either:
                    - pattern: $X + "..."
                    - pattern: '"..." + $X'
                    - pattern: f"...{$X}..."
                    - pattern: '"..." % $X'
                    - pattern: '"...".format(...)'
                - pattern-not: '"..." + "..."'
                - pattern-not-regex: (?i)escape
          - pattern-not: $COL.like(..., escape=$E, ...)
          - pattern-not: $COL.ilike(..., escape=$E, ...)
      # raw SQL whose text carries LIKE and is assembled at run time
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute($Q, ...)
              - pattern: $CUR.executemany($Q, ...)
              - pattern: $DB.raw($Q, ...)
              - pattern: text($Q)
              - pattern: sqlalchemy.text($Q)
          - metavariable-pattern:
              metavariable: $Q
              pattern-either:
                - pattern: $A + $B
                - pattern: f"...{$X}..."
                - pattern: $A % $B
                - pattern: $A.format(...)
          - metavariable-regex:
              metavariable: $Q
              regex: '(?is).*(?<!\()\bi?like\s+(?:\x27|\x22|%s|%\(|\$\d|\?|:[a-z_]|\{(?![^}]*\}\s+(?:including|excluding))|concat\b|\|\|)'
          - pattern-not-regex: (?i)\bescape\b
      # bound parameter that is itself a wildcard concatenation
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute("$SQL", $ARGS, ...)
              - pattern: $CUR.executemany("$SQL", $ARGS, ...)
          - metavariable-regex:
              metavariable: $SQL
              regex: '(?is).*(?<!\()\bi?like\s+(?:\x27|\x22|%s|%\(|\$\d|\?|:[a-z_]|\{(?![^}]*\}\s+(?:including|excluding))|concat\b|\|\|)'
          - metavariable-pattern:
              metavariable: $ARGS
              pattern-either:
                - pattern: $X + "%"
                - pattern: '"%" + $X'
                - pattern: f"{$X}%"
                - pattern: f"%{$X}%"
                - pattern: f"%{$X}"
          - pattern-not-regex: (?i)\bescape\b
      # bound parameter that is an f-string with an interpolation and a %
      # anywhere in it ("{owner}/{folder}/%"), in a tuple or list
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute("$SQL", $ARGS, ...)
              - pattern: $CUR.executemany("$SQL", $ARGS, ...)
          - metavariable-regex:
              metavariable: $SQL
              regex: '(?is).*(?<!\()\bi?like\s+(?:\x27|\x22|%s|%\(|\$\d|\?|:[a-z_]|\{(?![^}]*\}\s+(?:including|excluding))|concat\b|\|\|)'
          - metavariable-regex:
              metavariable: $ARGS
              regex: '(?s).*\bf(?:\x22|\x27)[^\x22\x27]*(?:\{[^}]+\}[^\x22\x27]*%|%[^\x22\x27]*\{[^}]+\})'
          - pattern-not-regex: (?i)\bescape\b
