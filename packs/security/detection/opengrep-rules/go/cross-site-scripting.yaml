rules:
  - id: traust-go-xss-reflected-response-taint
    languages: [go]
    severity: ERROR
    message: >-
      A request value reaches a response-body write. The rule does not
      check the effective Content-Type, escaping context or browser
      behavior; an HTML response may interpret attacker markup. Use
      html/template for HTML or an appropriate non-HTML content type and
      context-specific encoding. CWE-79.
    metadata:
      cwe: ["CWE-79"]
      category: cross-site-scripting
      asvs: ["V1"]
      confidence: MEDIUM
      references:
        - "CWE-79 reflected XSS — request values written to http.ResponseWriter"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $R.URL.Query().Get(...)
          - pattern: $R.FormValue(...)
          - pattern: $R.PostFormValue(...)
          - pattern: mux.Vars($R)
    pattern-sanitizers:
      - pattern-either:
          - pattern: html.EscapeString(...)
          - pattern: template.HTMLEscapeString(...)
          - pattern: url.QueryEscape(...)
          - pattern: strconv.Atoi(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fmt.Fprintf($W, $FMT, ..., $V, ...)
              - pattern: fmt.Fprint($W, ..., $V, ...)
              - pattern: fmt.Fprintln($W, ..., $V, ...)
              - pattern: io.WriteString($W, $V)
              - pattern: $W.Write([]byte($V))
          - metavariable-regex:
              metavariable: $W
              regex: ^(w|rw|resp|res|writer|response)$
          - focus-metavariable: $V

  - id: traust-go-xss-template-trusted-type
    languages: [go]
    severity: ERROR
    message: >-
      A request value is converted to an html/template trusted type,
      bypassing contextual escaping if later rendered. Confirm template
      use and the output context; HTML sanitization is not automatically
      safe for JS, CSS, URL or attribute contexts. Keep untrusted values
      as plain data and let the template escape them. CWE-79.
    metadata:
      cwe: ["CWE-79"]
      category: cross-site-scripting
      asvs: ["V1"]
      confidence: MEDIUM
      references:
        - "CWE-79 — html/template trusted-type conversion of request values"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $R.URL.Query().Get(...)
          - pattern: $R.FormValue(...)
          - pattern: $R.PostFormValue(...)
          - pattern: mux.Vars($R)
          - pattern: $C.Query(...)
          - pattern: $C.PostForm(...)
    pattern-sanitizers:
      - pattern-either:
          - pattern: html.EscapeString(...)
          - pattern: template.HTMLEscapeString(...)
          - pattern: $POLICY.Sanitize(...)
    pattern-sinks:
      - pattern-either:
          - pattern: template.HTML(...)
          - pattern: template.HTMLAttr(...)
          - pattern: template.JS(...)
          - pattern: template.JSStr(...)
          - pattern: template.URL(...)
          - pattern: template.CSS(...)
          - pattern: template.Srcset(...)
