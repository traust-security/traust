rules:
  - id: traust-go-open-redirect-taint
    languages: [go]
    severity: ERROR
    message: >-
      A request-derived value reaches a redirect target or Location header.
      Confirm that a redirect is sent and whether a guard restricts the
      destination; taint matching alone does not establish an exploitable
      off-origin redirect. Prefer fixed local destinations or a strict
      scheme/host allow-list. CWE-601.
    metadata:
      cwe: ["CWE-601"]
      category: open-redirect
      asvs: ["V3"]
      confidence: MEDIUM
      references:
        - "CWE-601 open redirect — request-supplied redirect targets"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $R.URL.Query().Get(...)
          - pattern: $R.FormValue(...)
          - pattern: $R.PostFormValue(...)
          - pattern: $R.Header.Get("Referer")
          - pattern: $C.Query(...)
          - pattern: $C.QueryParam(...)
          - pattern: $C.FormValue(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: http.Redirect($W, $R, $U, ...)
              - pattern: $W.Header().Set("Location", $U)
              - pattern: $C.Redirect($CODE, $U)
          - focus-metavariable: $U
