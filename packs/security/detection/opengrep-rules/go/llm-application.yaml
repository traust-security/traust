rules:
  # --- LLM05: improper output handling (model output is untrusted input) ---

  - id: traust-go-llm-application-output-to-exec-taint
    languages: [go]
    severity: ERROR
    message: >-
      Model-output-shaped data reaches exec.Command. Inspect the selected
      executable and argument semantics: controlling an argument is not
      automatically shell execution. Treat completions as untrusted and map
      them to a fixed set of permitted actions. CWE-1426, CWE-78.
    metadata:
      cwe: ["CWE-1426", "CWE-78"]
      category: llm-application
      asvs: ["V1"]
      owasp_llm: ["LLM05"]
      confidence: HIGH
      references:
        - "CWE-1426 improper validation of generative AI output — reaches a command sink"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $C.Chat.Completions.New(...)
          - pattern: $C.Completions.New(...)
          - pattern: $C.Responses.New(...)
          - pattern: $C.Messages.New(...)
          - pattern: $C.CreateChatCompletion(...)
          - pattern: $C.CreateCompletion(...)
          - pattern: $M.GenerateContent(...)
          - pattern: llms.GenerateFromSinglePrompt(...)
          - pattern: $R.Choices[$I].Message.Content
          - pattern: $R.Choices[$I].Text
          - pattern: $R.Content[$I].Text
    pattern-sinks:
      - pattern-either:
          - pattern: exec.Command(...)
          - pattern: exec.CommandContext(...)

  - id: traust-go-llm-application-output-to-sql-taint
    languages: [go]
    severity: ERROR
    message: >-
      Model-output-shaped data reaches a SQL query-text argument.
      Confirm the SDK source, query execution and connection privileges;
      a match does not establish prompt steerability or data exposure.
      Prefer fixed parameterized queries with caller-scoped access.
      CWE-1426, CWE-89.
    metadata:
      cwe: ["CWE-1426", "CWE-89"]
      category: llm-application
      asvs: ["V1"]
      owasp_llm: ["LLM05"]
      confidence: HIGH
      references:
        - "CWE-1426 improper validation of generative AI output — reaches a SQL sink"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $C.Chat.Completions.New(...)
          - pattern: $C.Completions.New(...)
          - pattern: $C.Responses.New(...)
          - pattern: $C.Messages.New(...)
          - pattern: $C.CreateChatCompletion(...)
          - pattern: $C.CreateCompletion(...)
          - pattern: $M.GenerateContent(...)
          - pattern: llms.GenerateFromSinglePrompt(...)
          - pattern: $R.Choices[$I].Message.Content
          - pattern: $R.Choices[$I].Text
          - pattern: $R.Content[$I].Text
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.Exec($Q, ...)
              - pattern: $DB.Query($Q, ...)
              - pattern: $DB.QueryRow($Q, ...)
              - pattern: $DB.ExecContext($CTX, $Q, ...)
              - pattern: $DB.QueryContext($CTX, $Q, ...)
              - pattern: $DB.QueryRowContext($CTX, $Q, ...)
          - focus-metavariable: $Q

  - id: traust-go-llm-application-output-to-path-taint
    languages: [go]
    severity: ERROR
    message: >-
      Model-output-shaped data reaches a filesystem path argument.
      Confirm intended confinement, permissions and downstream use before
      concluding that a completion can access arbitrary files. Generate
      names locally or enforce root containment. CWE-1426, CWE-22.
    metadata:
      cwe: ["CWE-1426", "CWE-22"]
      category: llm-application
      asvs: ["V5"]
      owasp_llm: ["LLM05"]
      confidence: HIGH
      references:
        - "CWE-1426 improper validation of generative AI output — reaches a file path"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $C.Chat.Completions.New(...)
          - pattern: $C.Completions.New(...)
          - pattern: $C.Responses.New(...)
          - pattern: $C.Messages.New(...)
          - pattern: $C.CreateChatCompletion(...)
          - pattern: $C.CreateCompletion(...)
          - pattern: $M.GenerateContent(...)
          - pattern: llms.GenerateFromSinglePrompt(...)
          - pattern: $R.Choices[$I].Message.Content
          - pattern: $R.Choices[$I].Text
          - pattern: $R.Content[$I].Text
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.Open($P)
              - pattern: os.OpenFile($P, ...)
              - pattern: os.Create($P)
              - pattern: os.ReadFile($P)
              - pattern: os.WriteFile($P, ...)
              - pattern: os.Remove($P)
              - pattern: os.RemoveAll($P)
          - focus-metavariable: $P

  # --- LLM06: excessive agency ---------------------------------------------

  - id: traust-go-llm-application-mcp-http-without-auth
    languages: [go]
    severity: WARNING
    message: >-
      An MCP HTTP/SSE constructor occurs in a file with no authentication-
      shaped text recognized by this heuristic. Construction does not
      establish serving or public reachability, and an auth-related word
      elsewhere does not prove that this handler is protected. Trace the
      mounted handler and require appropriate bearer/OAuth middleware
      before exposing sensitive tools. CWE-306.
    metadata:
      cwe: ["CWE-306", "CWE-862"]
      category: llm-application
      asvs: ["V6"]
      owasp_llm: ["LLM06"]
      confidence: MEDIUM
      references:
        - "CWE-306 missing authentication for critical function — MCP HTTP transport"
        - "https://modelcontextprotocol.io/specification/2025-06-18/basic/authorization"
    patterns:
      - pattern-either:
          - pattern: mcp.NewStreamableHTTPHandler(...)
          - pattern: mcp.NewSSEHandler(...)
          - pattern: server.NewStreamableHTTPServer(...)
          - pattern: server.NewSSEServer(...)
      # Text anywhere in the file suppresses the signal; this is not a
      # correlation between a handler and enforced authentication.
      - pattern-not-regex: (?is)\A.*?\b\w*(bearer|oauth|jwt|authenticat|authoriz|auth_?middleware|auth_?router|token_?verifier|verify_?token|extract_?\w*token)\w*.*\z

  # --- LLM10: unbounded consumption ----------------------------------------

  - id: traust-go-llm-application-unbounded-agent-loop
    languages: [go]
    severity: WARNING
    message: >-
      A model-call-shaped expression occurs inside an unconditional for
      loop without recognized limit-related text. This lexical heuristic
      does not prove nontermination or enforcement of a budget when such
      text is present. Inspect exit conditions and enforce step, time and
      cost limits. CWE-400, CWE-834.
    metadata:
      cwe: ["CWE-400", "CWE-834"]
      category: llm-application
      asvs: ["V2"]
      owasp_llm: ["LLM10"]
      confidence: MEDIUM
      references:
        - "CWE-834 excessive iteration — unbounded agent loop"
    patterns:
      - pattern: |
          for {
            $...BODY
          }
      - metavariable-regex:
          metavariable: $...BODY
          regex: (?s).*\b(Chat\.Completions\.New|Completions\.New|Responses\.New|Messages\.New|CreateChatCompletion|CreateCompletion|GenerateContent|GenerateFromSinglePrompt)\s*\(
      - metavariable-regex:
          metavariable: $...BODY
          regex: (?is)^(?!.*\b(max_?(steps|iterations|turns|rounds|calls)|step_?limit|budget|deadline|timeout)\b).*$
