# CWE-522: credentials placed into Prometheus metric labels.
rules:
  - id: traust-go-secrets-management-credential-in-metric-label
    languages: [go]
    severity: WARNING
    message: >-
      Credential-shaped value placed into a Prometheus metric label —
      label values persist in the time-series store, replicate through
      federation and remote-write, and appear on dashboards and alerts,
      all outside the credential's rotation and access boundary. Label
      with a redacted identifier (host, name) instead. Judge whether the
      value actually carries a secret. CWE-522.
    metadata:
      cwe: ["CWE-522"]
      category: secrets-management
      asvs: ["V6"]
      confidence: MEDIUM
      references:
        - "CWE-522 — credential material in Prometheus metric labels"
    patterns:
      - pattern-either:
          # credential-named label key
          - patterns:
              - pattern: 'prometheus.Labels{..., "$K": $V, ...}'
              - metavariable-regex:
                  metavariable: $K
                  regex: (?i)^[a-z0-9_.-]*(password|passwd|secret|token|apikey|api_key|credential|bearer)[a-z0-9_.-]*$
          # credential-named identifier as a label value
          - patterns:
              - pattern: 'prometheus.Labels{..., "$K": $V, ...}'
              - metavariable-regex:
                  metavariable: $V
                  regex: (?i)^(?![a-zA-Z0-9_.]*(url|uri|expiry|expires|expiresin|name|id|type|path|file|len|count|ttl|version|kind|ref|namespace|ns)$)[a-zA-Z0-9_.]*(password|passwd|secret|token|apikey|api_key|credential|bearer)[a-zA-Z0-9_.]*$
          # credential-named identifier passed as a positional label value
          - patterns:
              - pattern: $M.WithLabelValues(..., $V, ...)
              - metavariable-regex:
                  metavariable: $V
                  regex: (?i)^(?![a-zA-Z0-9_.]*(url|uri|expiry|expires|expiresin|name|id|type|path|file|len|count|ttl|version|kind|ref|namespace|ns)$)[a-zA-Z0-9_.]*(password|passwd|secret|token|apikey|api_key|credential|bearer)[a-zA-Z0-9_.]*$
          # URL stringified into a label — url.URL.String() preserves
          # embedded userinfo (user:password@host), so a webhook/endpoint
          # URL label carries any configured basic-auth credential (the
          # fixed code labels with $U.Redacted() instead, which no longer matches)
          - patterns:
              - pattern: $M.WithLabelValues(..., $U.String(), ...)
              - metavariable-regex:
                  metavariable: $U
                  regex: ^(h|u|url|uri|endpoint|target|webhook|hook|addr|address|upstream|remote)$
