rules:
  - id: traust-go-path-traversal-taint
    languages: [go]
    severity: ERROR
    message: >-
      A request-derived value reaches a filesystem path argument.
      Confirm whether traversal escapes an intended root and whether a
      guard, symlink policy or authorization check applies. Basename
      extraction alone does not establish those properties. CWE-22.
    metadata:
      cwe: ["CWE-22"]
      category: path-traversal
      asvs: ["V5"]
      confidence: HIGH
      references:
        - "CWE-22 path traversal — request-derived filesystem access"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $R.URL.Query().Get(...)
          - pattern: $R.URL.Query()[...]
          - pattern: $R.FormValue(...)
          - pattern: $R.PostFormValue(...)
          - pattern: mux.Vars($R)
          - pattern: $C.Param(...)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - pattern: securejoin.SecureJoin(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.Open($P)
              - pattern: os.ReadFile($P)
              - pattern: os.Create($P)
              - pattern: os.WriteFile($P, ...)
              - pattern: os.Remove($P)
              - pattern: http.ServeFile($W, $R, $P)
          - focus-metavariable: $P

  - id: traust-go-path-traversal-tar-slip
    languages: [go]
    severity: WARNING
    message: >-
      An archive-entry-shaped Name field is joined to a destination.
      The rule does not establish archive provenance, a subsequent write
      or a sound containment guard; a strings.HasPrefix exclusion is only
      syntactic. Verify a separator-bounded root check and symlink policy
      before extracting untrusted archives. CWE-22.
    metadata:
      cwe: ["CWE-22"]
      category: path-traversal
      asvs: ["V5"]
      confidence: MEDIUM
      references:
        - "CWE-22 path traversal — archive slip via entry name join"
    patterns:
      - pattern-either:
          - pattern: filepath.Join($DST, $HDR.Name)
          - pattern: filepath.Join($DST, $F.Name)
      - pattern-not-inside: |
          if strings.HasPrefix(...) { ... }
