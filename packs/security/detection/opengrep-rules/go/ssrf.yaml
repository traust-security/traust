rules:
  - id: traust-go-ssrf-request-taint
    languages: [go]
    severity: ERROR
    message: >-
      A request-derived value reaches an outbound-URL argument. Confirm
      destination control, redirect behavior and network reachability
      before concluding that internal services are accessible. This
      raw-string rule excludes parsed URLs; parsing alone is not a security
      check. Validate destinations and enforce egress policy. CWE-918.
    metadata:
      cwe: ["CWE-918"]
      category: ssrf
      asvs: ["V4"]
      confidence: MEDIUM
      references:
        - "CWE-918 SSRF — request-derived values reaching outbound HTTP calls"
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $R.URL.Query().Get(...)
          - pattern: $R.URL.Query()[...]
          - pattern: $R.FormValue(...)
          - pattern: $R.PostFormValue(...)
          - pattern: mux.Vars($R)
          # generic context/url receivers — over-broad by design (the
          # confirmed TPs fire through url.URL receivers in hand-written
          # code); the generated-client FP mass is removed by the paths
          # exclusion below instead
          - pattern: $C.Param(...)
          - pattern: $C.Query(...)
    # Deliberate matching boundary, not proof of safety: structured parsing
    # suppresses this raw-string rule even when no host check follows.
    pattern-sanitizers:
      - pattern: url.Parse(...)
      - pattern: url.ParseRequestURI(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: http.Get($U)
              - pattern: http.Post($U, ...)
              - pattern: http.Head($U)
              - pattern: http.NewRequest($M, $U, ...)
              - pattern: http.NewRequestWithContext($CTX, $M, $U, ...)
          - focus-metavariable: $U
    paths:
      exclude:
        - "*.gen.go"
        - "*_gen.go"
        - "*generated*"
        - "zz_generated*"
