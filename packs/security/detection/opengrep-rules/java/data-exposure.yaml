rules:
  - id: traust-java-data-exposure-actuator-permit-all
    languages: [java]
    severity: ERROR
    message: >-
      Spring Security contains a broad anonymous actuator matcher or a
      permit-all fallback in an actuator-selected chain. Literal
      /actuator paths do not prove coverage of the configured management
      base path. Review endpoint exposure and first-match authorization;
      use endpoint-aware protection or a whole-chain policy. CWE-200.
    metadata:
      cwe: ["CWE-200", "CWE-306"]
      category: data-exposure
      asvs: ["V13"]
      confidence: HIGH
      references:
        - "CWE-200 exposed management endpoints — actuator permitted to anonymous callers"
    pattern-either:
      - pattern: $A.requestMatchers(EndpointRequest.toAnyEndpoint(...)).permitAll()
      - pattern: $A.requestMatchers("/actuator/**").permitAll()
      - pattern: $A.antMatchers("/actuator/**").permitAll()
      - pattern: $A.mvcMatchers("/actuator/**").permitAll()
      # Selected chains may fall through after narrower authorization branches.
      - patterns:
          - pattern-either:
              - pattern: $PREFIX.anyRequest().permitAll()
              - pattern: $PREFIX.antMatchers("/**").permitAll()
              - pattern: $PREFIX.requestMatchers("/**").permitAll()
              - pattern: $PREFIX.mvcMatchers("/**").permitAll()
          - metavariable-pattern:
              metavariable: $PREFIX
              pattern-either:
                - pattern: <... $HTTP.requestMatcher(EndpointRequest.toAnyEndpoint(...)).authorizeRequests() ...>
                - pattern: <... $HTTP.requestMatcher(EndpointRequest.toAnyEndpoint(...)).authorizeHttpRequests() ...>
                - pattern: <... $HTTP.securityMatcher(EndpointRequest.toAnyEndpoint(...)).authorizeRequests() ...>
                - pattern: <... $HTTP.securityMatcher(EndpointRequest.toAnyEndpoint(...)).authorizeHttpRequests() ...>
          - metavariable-pattern:
              metavariable: $PREFIX
              patterns:
                - pattern: $EXPRESSION
                - metavariable-comparison:
                    metavariable: $EXPRESSION
                    comparison: str($EXPRESSION) == str($PREFIX)
                - pattern-not: <... $CHAIN.requestMatchers(EndpointRequest.toAnyEndpoint(...)).$DECISION(...) ...>
                - pattern-not: <... $CHAIN.requestMatchers("/**").$DECISION(...) ...>
                - pattern-not: <... $CHAIN.antMatchers("/**").$DECISION(...) ...>
                - pattern-not: <... $CHAIN.mvcMatchers("/**").$DECISION(...) ...>
                - pattern-not: <... $CHAIN.anyRequest().$DECISION(...) ...>
      - patterns:
          - pattern-either:
              - pattern: $HTTP.$SELECT(EndpointRequest.toAnyEndpoint(...)).$AUTHORIZE($AUTH -> $PREFIX.anyRequest().permitAll())
              - pattern: $HTTP.$SELECT(EndpointRequest.toAnyEndpoint(...)).$AUTHORIZE($AUTH -> $PREFIX.antMatchers("/**").permitAll())
              - pattern: $HTTP.$SELECT(EndpointRequest.toAnyEndpoint(...)).$AUTHORIZE($AUTH -> $PREFIX.requestMatchers("/**").permitAll())
              - pattern: $HTTP.$SELECT(EndpointRequest.toAnyEndpoint(...)).$AUTHORIZE($AUTH -> $PREFIX.mvcMatchers("/**").permitAll())
          - metavariable-regex:
              metavariable: $SELECT
              regex: ^(requestMatcher|securityMatcher)$
          - metavariable-regex:
              metavariable: $AUTHORIZE
              regex: ^(authorizeRequests|authorizeHttpRequests)$
          - metavariable-pattern:
              metavariable: $PREFIX
              pattern: <... $AUTH ...>
          - metavariable-pattern:
              metavariable: $PREFIX
              patterns:
                - pattern: $EXPRESSION
                - metavariable-comparison:
                    metavariable: $EXPRESSION
                    comparison: str($EXPRESSION) == str($PREFIX)
                - pattern-not: <... $CHAIN.requestMatchers(EndpointRequest.toAnyEndpoint(...)).$DECISION(...) ...>
                - pattern-not: <... $CHAIN.requestMatchers("/**").$DECISION(...) ...>
                - pattern-not: <... $CHAIN.antMatchers("/**").$DECISION(...) ...>
                - pattern-not: <... $CHAIN.mvcMatchers("/**").$DECISION(...) ...>
                - pattern-not: <... $CHAIN.anyRequest().$DECISION(...) ...>
      - patterns:
          - pattern: |
              $HTTP.$SELECT(EndpointRequest.toAnyEndpoint(...)).$AUTHORIZE($AUTH -> {
                ...
                $TERMINAL;
                ...
              })
          - metavariable-regex:
              metavariable: $SELECT
              regex: ^(requestMatcher|securityMatcher)$
          - metavariable-regex:
              metavariable: $AUTHORIZE
              regex: ^(authorizeRequests|authorizeHttpRequests)$
          - metavariable-pattern:
              metavariable: $TERMINAL
              patterns:
                - pattern-either:
                    - pattern: $PREFIX.anyRequest().permitAll()
                    - pattern: $PREFIX.antMatchers("/**").permitAll()
                    - pattern: $PREFIX.requestMatchers("/**").permitAll()
                    - pattern: $PREFIX.mvcMatchers("/**").permitAll()
                - metavariable-pattern:
                    metavariable: $PREFIX
                    pattern: <... $AUTH ...>
                - metavariable-pattern:
                    metavariable: $PREFIX
                    patterns:
                      - pattern: $EXPRESSION
                      - metavariable-comparison:
                          metavariable: $EXPRESSION
                          comparison: str($EXPRESSION) == str($PREFIX)
                      - pattern-not: <... $CHAIN.requestMatchers(EndpointRequest.toAnyEndpoint(...)).$DECISION(...) ...>
                      - pattern-not: <... $CHAIN.requestMatchers("/**").$DECISION(...) ...>
                      - pattern-not: <... $CHAIN.antMatchers("/**").$DECISION(...) ...>
                      - pattern-not: <... $CHAIN.mvcMatchers("/**").$DECISION(...) ...>
                      - pattern-not: <... $CHAIN.anyRequest().$DECISION(...) ...>
          - pattern-not-inside: |
              $HTTP.$SELECT(EndpointRequest.toAnyEndpoint(...)).$AUTHORIZE($AUTH -> {
                ...
                (<... $AUTH ...>).$MATCHER(EndpointRequest.toAnyEndpoint(...)).$DECISION(...);
                ...
                $TERMINAL;
                ...
              })
          - pattern-not-inside: |
              $HTTP.$SELECT(EndpointRequest.toAnyEndpoint(...)).$AUTHORIZE($AUTH -> {
                ...
                (<... $AUTH ...>).$MATCHER("/**").$DECISION(...);
                ...
                $TERMINAL;
                ...
              })
          - pattern-not-inside: |
              $HTTP.$SELECT(EndpointRequest.toAnyEndpoint(...)).$AUTHORIZE($AUTH -> {
                ...
                (<... $AUTH ...>).anyRequest().$DECISION(...);
                ...
                $TERMINAL;
                ...
              })

  - id: traust-java-data-exposure-actuator-web-exposure-all
    languages: [regex]
    severity: WARNING
    message: >-
      The Spring Boot configuration exposes every actuator endpoint over
      HTTP, or a sensitive one by name (env, heapdump, threaddump,
      configprops, beans, mappings, loggers, shutdown, jolokia). They show
      configuration and secrets, memory contents, or change state. Expose
      health and info, and anything else only behind an operator role.
      CWE-200.
    metadata:
      cwe: ["CWE-200"]
      category: data-exposure
      asvs: ["V13"]
      confidence: MEDIUM
      references:
        - "CWE-200 exposed management endpoints — management.endpoints.web.exposure.include"
    paths:
      include: ["*.properties"]
    pattern-regex: (?m)^[ \t]*management\.endpoints\.web\.exposure\.include[ \t]*[=:][ \t]*(?:\*|.*\b(?:env|heapdump|threaddump|configprops|beans|mappings|loggers|shutdown|jolokia)\b).*$

  - id: traust-java-data-exposure-error-stacktrace-always
    languages: [regex]
    severity: WARNING
    message: >-
      Spring Boot error responses always include the stack trace, which
      shows callers the code paths, library versions and sometimes the data
      behind a failure. Leave include-stacktrace at never in deployed
      configuration. CWE-209.
    metadata:
      cwe: ["CWE-209"]
      category: data-exposure
      asvs: ["V16"]
      confidence: HIGH
      references:
        - "CWE-209 error detail exposure — server.error.include-stacktrace=always"
    paths:
      include: ["*.properties"]
    pattern-regex: (?m)^[ \t]*server\.error\.include-stacktrace[ \t]*[=:][ \t]*(?:always|ALWAYS)[ \t]*$
