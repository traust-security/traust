# Shipped deployment defaults in helm values / docker-compose / operator CR samples.
rules:
  - id: traust-yaml-cryptography-dsn-sslmode-disabled
    languages: [yaml]
    severity: ERROR
    message: >-
      Configuration contains a database sslmode of disable/allow/prefer.
      If this value is consumed without a stronger override, the connection
      may permit plaintext or lack server authentication. Confirm the
      effective deployment setting and prefer verify-full; require alone
      does not generally establish hostname verification. CWE-319.
    metadata:
      cwe: ["CWE-319"]
      category: cryptography
      asvs: ["V12"]
      confidence: HIGH
      references:
        - "CWE-319 cleartext transmission — database sslmode disabled in shipped config defaults"
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  $KEY: $VAL
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^['"]?(ssl[_-]?mode)['"]?$
              - metavariable-regex:
                  metavariable: $VAL
                  regex: (?i)^['"]?(disable|allow|prefer)['"]?$
          # DSN strings embedded in values/env entries, incl. compose
          # `- KEY=value` list form.
          - pattern-regex: (?i)sslmode=(disable|allow|prefer)

  - id: traust-yaml-cryptography-tls-verify-disabled
    languages: [yaml]
    severity: ERROR
    message: >-
      Configuration contains a TLS-verification-disable-shaped setting.
      Confirm the consuming component's meaning, effective overrides and
      network use before concluding that an on-path attacker can
      impersonate the server. Keep certificate verification on. CWE-295.
    metadata:
      cwe: ["CWE-295"]
      category: cryptography
      asvs: ["V12"]
      confidence: MEDIUM
      references:
        - "CWE-295 certificate validation — TLS verify disabled in shipped config defaults"
    patterns:
      - pattern-either:
          - patterns:
              - pattern: |
                  $KEY: $VAL
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^['"]?(openssl[_-]?verify|(ssl|tls)[_-]?(verify|verification)|verify[_-]?(ssl|tls|certs?|peer))['"]?$
              - metavariable-regex:
                  metavariable: $VAL
                  regex: (?i)^['"]?(false|no|off|0|disabled?|none)['"]?$
          - patterns:
              - pattern: |
                  $KEY: $VAL
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i)^['"]?(insecure|(insecure[_-]?)?skip[_-]?(tls[_-]?)?verify|(ssl|tls)[_-]?insecure([_-]?skip[_-]?verify)?)['"]?$
              - metavariable-regex:
                  metavariable: $VAL
                  regex: (?i)^['"]?(true|yes|on|1)['"]?$
          # compose/env `- KEY=value` list form
          - pattern-regex: (?i)^\s*-?\s*['"]?(OPENSSL_VERIFY|(SSL|TLS)_VERIFY|VERIFY_(SSL|TLS))['"]?\s*=\s*['"]?(false|no|off|0)['"]?\s*$
