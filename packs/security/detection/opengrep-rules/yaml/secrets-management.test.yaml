# Fixtures for the yaml secrets-management config-defaults rules. All
# values synthetic.
keycloak:
  # ruleid: traust-yaml-secrets-management-default-password
  adminPassword: admin123456
  # ok: traust-yaml-secrets-management-default-password
  realm: trust

postgres:
  # ruleid: traust-yaml-secrets-management-default-password
  password: "changeme"
  # ok: traust-yaml-secrets-management-default-password
  passwordSecretRef: app-db-credentials
  # ok: traust-yaml-secrets-management-default-password
  password2: "{{ .Values.global.dbPassword }}"

compose_environment:
  # ruleid: traust-yaml-secrets-management-default-password
  - POSTGRES_PASSWORD=postgres
  # ok: traust-yaml-secrets-management-default-password
  - POSTGRES_PASSWORD=${DB_PASSWORD}

emptydefaults:
  # ruleid: traust-yaml-secrets-management-empty-password
  password: ""
  # ruleid: traust-yaml-secrets-management-empty-password
  MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
  # ok: traust-yaml-secrets-management-empty-password
  username: ""

mysql_env:
  # ruleid: traust-yaml-secrets-management-empty-password
  - MYSQL_ALLOW_EMPTY_PASSWORD=yes
  # ok: traust-yaml-secrets-management-empty-password
  - MYSQL_ALLOW_EMPTY_PASSWORD=no

# k8s-manifest scoping: documents carrying apiVersion are excluded for the
# empty-password rule. The default-password rule is not k8s-scoped.
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
stringData:
  # ok: traust-yaml-secrets-management-empty-password
  password: ""
