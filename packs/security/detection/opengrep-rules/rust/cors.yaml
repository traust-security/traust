rules:
  - id: traust-rust-cors-any-origin-with-credentials
    languages: [rust]
    severity: ERROR
    message: >-
      A permissive CORS API is used, or an any-origin call occurs in a file
      mentioning credentials support. The latter is file-level
      co-occurrence, not proof that both settings belong to the same layer.
      Confirm the effective policy, library behavior and cookie/browser
      conditions before concluding that credentialed responses are readable
      cross-origin. List allowed origins explicitly. CWE-942.
    metadata:
      cwe: ["CWE-942", "CWE-346"]
      category: cors
      asvs: ["V3"]
      confidence: HIGH
      references:
        - "CWE-942 permissive cross-origin policy — mirrored origin with credentials"
    pattern-either:
      - pattern: CorsLayer::very_permissive()
      - pattern: Cors::very_permissive($S)
      - pattern: Cors::permissive()
      - patterns:
          - pattern-either:
              - pattern: $C.allow_origin(AllowOrigin::mirror_request())
              - pattern: $C.allow_origin(AllowOrigin::predicate(|$O, $P| true))
              - pattern: $C.allow_any_origin()
          - pattern-inside:
              pattern-regex: (?s)\A(?=.*(?:allow_credentials\s*\(\s*true\s*\)|supports_credentials\s*\(\s*\))).*
