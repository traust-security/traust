rules:
  - id: traust-bash-data-exposure-cred-in-argv
    languages: [bash]
    severity: ERROR
    message: >-
      Credential-bearing login argument — command lines can be exposed
      through process inspection and are echoed into CI logs when xtrace
      is enabled. Confirm the value is a live credential and use the
      tool's stdin/credential-file mechanism. CWE-532/CWE-214.
    metadata:
      cwe: ["CWE-532", "CWE-214"]
      category: data-exposure
      asvs: ["V16"]
      confidence: HIGH
      references:
        - "CWE-532/CWE-214 — credentials on command line in shell scripts"
    patterns:
      - pattern-either:
          - pattern: $TOOL login ... -p $VAL ...
          - pattern: $TOOL login ... -p=$VAL ...
          - pattern: $TOOL login ... --password $VAL ...
          - pattern: $TOOL login ... --password=$VAL ...
          - pattern: $TOOL login -p $VAL ...
          - pattern: $TOOL login -p=$VAL ...
      - metavariable-regex:
          metavariable: $TOOL
          regex: ^(podman|docker|skopeo|oc|buildah|helm|cosign)$

  - id: traust-bash-data-exposure-xtrace
    languages: [bash]
    severity: INFO
    message: >-
      Shell tracing is enabled in a file containing credential-shaped
      text or a remote-script source. This file-level heuristic does not
      establish that a live secret is expanded while tracing is active.
      Check execution order and disable tracing before sensitive
      expansions with `set +x`. CWE-532.
    metadata:
      cwe: ["CWE-532"]
      category: data-exposure
      asvs: ["V16"]
      confidence: LOW
      references:
        - "CWE-532 — shell tracing with credential lexicon or remote script source"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: set $FLAGS
                  - pattern: set $FLAGS ...
              - metavariable-regex:
                  metavariable: $FLAGS
                  regex: ^-[a-w]*x[a-w]*$
          - pattern: set -o xtrace
      # File-level text co-occurrence, not a control-flow check: comments,
      # unrelated functions, and guarded sections can satisfy this signal.
      - pattern-inside:
          pattern-regex: (?is)\A(?=.*(password|passwd|secret|token|api[_-]?key|credential|bearer|aws_access_key|aws_secret_access|source\s*<\(\s*curl|curl[^\n]*\|\s*(ba|z)?sh)).*
