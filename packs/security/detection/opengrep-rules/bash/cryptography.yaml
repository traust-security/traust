rules:
  - id: traust-bash-cryptography-cosign-classical-signing
    languages: [bash]
    severity: INFO
    message: >-
      A cosign signing, attestation or key-generation command occurs.
      Inventory the actual key algorithm and artifact verification
      lifetime for the post-quantum transition; the command alone does
      not establish an ECDSA key, CI/release use, or a multi-year lifetime.
      This inventory signal is not a present-day defect. Tag applicable
      classical signatures pqc_classification=shor-signature. CWE-327.
    metadata:
      cwe: ["CWE-327"]
      category: cryptography
      asvs: ["V11"]
      confidence: HIGH
      pqc_classification: shor-signature
      references:
        - "CWE-327 — cosign classical signing inventory (command-verb anchored)"
    patterns:
      - pattern-either:
          - pattern: cosign sign ...
          - pattern: cosign sign-blob ...
          - pattern: cosign attest ...
          - pattern: cosign generate-key-pair ...
