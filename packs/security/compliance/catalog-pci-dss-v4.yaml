# PCI DSS v4.x — requirement-ID catalog.
#
# Requirement IDs and principal-requirement area labels only (facts,
# citable). PCI DSS text is PCI SSC copyright — it never appears here
# or anywhere in the workspace (harness content-guard rule 4). Area
# labels below are HARNESS-AUTHORED shorthand, not the standard's
# headings. A declared CDE boundary is mandatory input for every PCI
# run; requirements are assessed only against systems inside it.
