# Copy to $TRAUST_CONFIG_HOME/reachability-watch.yaml; this example is never read at runtime.
# A human answers each question, updates checked/last_answer, acts on fired triggers,
# then sets reviewed to the actual review date. Fetching or changing the engine roster
# never counts as a review. /drift-watch reports the independent review clock.

reviewed: null
review_cadence_days: 92
reviewer: null

watch:
  - id: advisory-symbol-data
    question: >-
      Does your advisory feed publish vulnerable-symbol or call-graph data
      for ecosystems without a wired symbol-tier reachability engine?
    why_it_matters: >-
      Advisory-side symbol data may enable a new reachability lane.
    checked: null
    last_answer: null
    on_fire: >-
      Review a facts-only engine pilot against a ground-truth corpus and
      record the resulting coverage decision before enabling the lane.
