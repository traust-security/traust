# Security-data source registry — the single source of truth for every
# external vulnerability/exploitability source the harness consumes,
# whether it is cached locally or queried live.
#
# WHY ONE FILE FOR BOTH TIERS
# Before this registry the four tiers were managed four different ways:
# cached feeds in a Python dict, live APIs as hardcoded URLs plus an
# argparse literal, tool DBs in config/external-tools.yaml, and ATT&CK as
# a vendored blob. Only the cached tier had freshness tracking, so a live
# source could fail indefinitely with nothing noticing — measured
# 2026-08-25, `fetch_advisory.py csaf` requested
# `csaf/v2/advisories/<cve>.json` and returned 404 for EVERY CVE (Red Hat
# keys CSAF advisories by RHSA, never by CVE). No registry to inspect, no
# check to fail. This file exists so that adding a source is a config
# change and a dead source is a failing drift row.
#
# Consumers:
#   - traust.registry.feeds_config — the loader; every other
#     consumer goes through it rather than parsing this file directly.
#   - traust.cli.fetch_feeds — refreshes `tier: cached`.
#   - harnessing/3-audit/impact-analysis/scripts/fetch_advisory.py — resolves
#     `tier: live` sources; its `source` argument is generated from the
#     ids here, so a new live source needs no code change.
#   - traust.cli.check_drift — `feeds:*` rows from the cached
#     tier, `feed-source:*` liveness rows from every source carrying a
#     `probe`.
#
# NOT HERE, deliberately:
#   - Tool-managed vulnerability DBs (grype, govulncheck, osv-scanner):
#     the tools own their refresh; watched by `external-tools:*` for the
#     binary and `grype-db` for grype's DB content age.
#   - MITRE ATT&CK: vendored + sha256-pinned under
#     harnessing/attack-coverage/tables/, advanced by a reviewed commit.
#   - Non-security reference registries: `product-definitions` (the Red
#     Hat product/ownership/notification registry) is NOT a security feed
#     — it carries ps_products, contacts and cc_lists, zero vulnerability
#     data — and is excluded from this file for that reason. It remains
#     wired in fetch_feeds.py under a `pending relocation` block, with
#     its five consumers untouched, until its destination is decided.
#
# Every entry MUST carry a `license` block — docs/external-dependencies.md
# holds the prose rows and the commercialization analysis, and
# check-licensing walks the same intake checklist when a source is added.
version: 1

# Download-retry policy for cached-feed refreshes (traust.cli.fetch_feeds).
# Defaults for every cached source; a source may override any key under its
# own `retry:` block. 429 honours Retry-After (capped by max_wait_s); 5xx and
# timeouts use capped exponential backoff (backoff_base_s * 2**attempt, + up to
# jitter_s). A non-429 4xx is not retried.
retry:
  max_attempts: 4
  timeout_s: 120
  backoff_base_s: 1
  max_wait_s: 60
  jitter_s: 0.5

sources:

  # ---------------------------------------------------------------- cached
  epss:
    tier: cached
    mode: file
    summary: FIRST EPSS daily exploit-prediction scores for every scored CVE.
    url: https://epss.cyentia.com/epss_scores-current.csv.gz
    file: epss_scores-current.csv.gz
    # EPSS recomputes once daily and stamps score_date in the payload
    # header; polling faster returns byte-identical content.
    max_age_hours: 24
    cadence: daily
    consumers:
      - harnessing/3-audit/secure-code-audit/scripts/enrich_findings_cves.py
    license:
      id: free-commercial-with-attribution
      terms: Free to the public including commercial products; "appropriate attribution" requested.
      url: https://www.first.org/epss/faq
      attribution: EPSS at https://www.first.org/epss
      verified: 2026-07-18

  kev:
    tier: cached
    mode: file
    summary: CISA Known Exploited Vulnerabilities catalog.
    url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    file: known_exploited_vulnerabilities.json
    # CISA publishes weekday additions in small batches (1-4 entries);
    # daily polling catches every addition same-day. There is no per-CVE
    # endpoint — the whole catalog is the only interface.
    max_age_hours: 24
    cadence: daily
    consumers:
      - harnessing/3-audit/secure-code-audit/scripts/enrich_findings_cves.py
    license:
      id: CC0-1.0
      terms: >-
        "use this data in any legal manner"; no CISA/DHS logo use or
        implication of endorsement. Third-party links inside KEV records
        carry their own terms.
      url: https://www.cisa.gov/sites/default/files/licenses/kev/license.txt
      verified: 2026-07-18

  rh-cve:
    tier: cached
    mode: paginated-incremental
    summary: Red Hat Security Data CVE records, for first-discovery provenance.
    url: https://access.redhat.com/hydra/rest/securitydata/cve.json
    file: rh_cve.json
    # CVEs publish daily; a day-old copy is the most a first-discovery
    # comparison can tolerate before it credits us with advisories that
    # were already public.
    max_age_hours: 24
    cadence: daily
    paginate:
      page_param: page
      per_page: 1000
    incremental:
      since_param: after
      watermark_field: public_date
      backfill_from: '2026-05-01'
    # Projection, not a component filter. Filtering to currently-audited
    # components would save ~3.7 MB/yr and go blind on every repo audited
    # afterwards; the component join belongs in the consumer.
    project: [CVE, public_date, bugzilla_description, severity, cvss3_score, CWE]
    probe:
      ident: none
      expect_status: 200
    consumers:
      - traust.cli.reconcile_cve_provenance
    license:
      id: CC-BY-4.0
      terms: Attribute Red Hat when redistributing. Public endpoint, no VPN.
      url: https://access.redhat.com/security/data
      verified: 2026-08-20

  vex:
    tier: cached
    mode: indexed-lazy
    summary: >-
      Red Hat CSAF VEX — per-CVE product impact status across the whole Red Hat
      catalogue: known_affected, known_not_affected (with machine-readable
      justification flags), fixed, under_investigation.
    # The index is synced on cadence; individual documents are fetched on
    # demand and cached, because our access pattern is advisory-at-a-time
    # and the full corpus is a 293 MB zstd archive whose products are
    # mostly ones we do not ship. `--mirror` on fetch_feeds opts into the
    # complete local mirror when an offline fleet-wide query is needed.
    index_url: https://access.redhat.com/security/data/csaf/v2/vex/changes.csv
    index_file: vex/changes.csv
    deletions_url: https://access.redhat.com/security/data/csaf/v2/vex/deletions.csv
    archive_pointer_url: https://access.redhat.com/security/data/csaf/v2/vex/archive_latest.txt
    doc_url_template: https://access.redhat.com/security/data/csaf/v2/vex/{year}/{ident_lower}.json
    doc_cache_dir: vex
    # changes.csv is a rolling 12-month window ("path","timestamp"),
    # newest-first; median 117 changed docs/day, bursting to ~950.
    max_age_hours: 24
    cadence: daily
    ident: cve
    probe:
      ident: CVE-2021-44228
      expect_status: 200
    consumers:
      - harnessing/3-audit/impact-analysis/scripts/fetch_advisory.py
      - harnessing/4-triage/triage
    license:
      id: CC-BY-4.0
      terms: Attribute Red Hat when redistributing. Public endpoint, no VPN.
      url: https://access.redhat.com/security/data
      verified: 2026-08-25

  # ------------------------------------------------------------------ live
  osv:
    tier: live
    summary: >-
      OSV.dev — the primary advisory transport. GHSA records are OSV-native, so
      this is also how GitHub Security Advisories reach the harness (an npm
      package query returns GHSA-prefixed ids).
    url_template: https://api.osv.dev/v1/query
    method: POST
    ident: package
    probe:
      ident: lodash
      ecosystem: npm
      expect_status: 200
    consumers:
      - harnessing/3-audit/dependency-watch/scripts/fleet_sweep.py
      - harnessing/3-audit/impact-analysis/scripts/fetch_advisory.py
      - harnessing/3-audit/secure-code-audit/scripts/run_fork_advisory_lag.py
      - traust.cli.resolve_advisory_symbols
      - traust.ops.cve_replay_monitor
    license:
      id: pass-through
      terms: >-
        Each record keeps its home database's license (mostly CC-BY-4.0; some
        CC0/MIT/BSD).
      url: https://osv.dev/
      verified: 2026-07-18

  nvd:
    tier: live
    summary: NVD CVE API 2.0 — CVE-keyed lookup.
    url_template: https://services.nvd.nist.gov/rest/json/cves/2.0?cveId={ident_upper}
    ident: cve
    probe:
      ident: CVE-2021-44228
      expect_status: 200
    # Keyless is rate-limited; an NVD API key is a quality-of-service
    # upgrade, never a correctness requirement.
    api_key_env: NVD_API_KEY
    consumers:
      - harnessing/3-audit/impact-analysis/scripts/fetch_advisory.py
    license:
      id: public-domain-with-attribution-request
      terms: >-
        Free public API. Attribution requested: "This product uses the NVD API
        but is not endorsed or certified by the NVD."
      url: https://nvd.nist.gov/developers/terms-of-use
      verified: 2026-07-18

  redhat-csaf:
    tier: live
    summary: >-
      Red Hat CSAF advisories, keyed by RHSA. NOT CVE-keyed — requesting
      advisories/<cve>.json 404s for every CVE, which is what the removed
      `csaf` source did. For CVE-keyed Red Hat product impact use `vex`.
    url_template: https://access.redhat.com/security/data/csaf/v2/advisories/{year}/{ident_lower_us}.json
    ident: rhsa
    probe:
      ident: RHSA-2024:6493
      expect_status: 200
    consumers:
      - harnessing/3-audit/secure-rpm-audit
      - harnessing/3-audit/secure-container-audit
    license:
      id: CC-BY-4.0
      terms: Attribute Red Hat when redistributing.
      url: https://access.redhat.com/security/data
      verified: 2026-08-25

  ossf-scorecard:
    tier: live
    summary: OpenSSF Scorecard supply-chain posture scores for a repository.
    url_template: https://api.securityscorecards.dev/projects/{ident}
    ident: repo
    probe:
      ident: github.com/kubernetes/kubernetes
      expect_status: 200
    consumers:
      - harnessing/3-audit/secure-code-audit
      - harnessing/3-audit/secure-rpm-audit
    license:
      id: CDLA-Permissive-2.0
      terms: CDLA-Permissive-2.0 for the data; Apache-2.0 for the code. Essentially no downstream obligations.
      url: https://github.com/ossf/scorecard
      verified: 2026-07-18
