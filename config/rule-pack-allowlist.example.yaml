# Template for the allowlist `overrides.rule_pack_allowlist` in traust.yaml names (shipped
# default: no supplements). Copy it beside traust.yaml, point the override at it, and edit.
# The harness never reads this example at run time.
#
# Supplemental external or adopter-authored opengrep packs, enabled PER RULE.
#
# This file is the switch. `traust adapters opengrep` reads the configured copy
# on default scans (no explicit --rules). Selected adopter rules add coverage;
# they do not replace portfolio/ledger mining. The /mine-ledger lane continues
# to re-score enabled rules against its precision gate and flags demotion candidates.
#
# Why per-rule and never wholesale: argus-observe-rules ships 640 rules of
# which 19 account for 86% of finding volume (~119 novel findings/repo of
# reflection and single-argument .get() matches). Enabling the pack whole
# would bury triage; enabling the calibrated subset costs ~1.4 novel/repo.
#
# Before enabling, run: traust sweep check-rules <complete-rule-directory>
# This requires native opengrep validate and opengrep test --json --strict,
# positive ruleid: and negative ok: cases for EVERY rule, exact expected
# matches, and complete receipts: missing/unknown/skipped checks fail.
# Direct native commands are useful diagnostics, not substitutes for this gate.
# Fixtures need meaningful vulnerable and equivalent safe/fixed/guarded cases;
# matching tests do not prove exploitability or business/security logic.
# Semantic review and recorded-scan calibration remain necessary. Precision
# accrues afterwards from scanner_correlation and is re-checked by the lane.
#
# Reuse overrides.rule_pack_allowlist; no additional extension setting is needed.
# source accepts a local rule directory (relative to THIS allowlist file, with
# paired native fixtures), or HTTPS Git pinned as URL@<40-hex-commit-SHA>.
# Git sources retain the repository's rules/ subtree convention.
# Enabled packs require explicit unique rule IDs. The WHOLE source pack must
# pass native validation/tests even when only some IDs are selected.
# There is no validation bypass: unreachable/invalid enabled supplements fail
# the run rather than silently skipping a pack. Disable one explicitly below.
# Upgrade: editing this example does not update an adopter's installed copy.
# Validate every enabled source before upgrading; repair/curate it or explicitly
# disable it and record the coverage gap. See the rule-pack README's
# "Upgrading enabled supplements" procedure.
# Draft skeletons and before/after snapshots are not active validated packs.

packs:
  argus-observe-rules:
    # Keep disabled until the full-pack gate passes; then explicitly enable.
    enabled: false
    source: https://github.com/smith-xyz/argus-observe-rules@2a94aebee9a26a7e0325582330c4eed232b984fb
    # Historical calibration below does not establish that this revision
    # satisfies today's mandatory full-pack gate. Validate before enabling.
    # Calibrated 2026-08-06/07 over 263 crypto targets — record the
    # evidence location for YOUR calibration here.
    # Comments are repos_rediscovered, rediscoveries, novel%.
    rules:
      - go-tls-bypass                            # 42, 110, 34%
      - go-crypto-certificate-validation         # 41, 75, 38%
      - go-http-client-tls-override              # 31, 39, 59%
      - python-certificate-validation-override   # 22, 35, 38%
      - python-tls-bypass                        # 18, 41, 41%
      - python-http-client-tls-override          # 12, 22, 62%
      - python-crypto-certificate-validation     # 8, 9, 25%
      - go-crypto-cipher-modes                   # 4, 17, 26%
      - javascript-tls-bypass                    # 4, 8, 0%
      - typescript-tls-bypass                    # 4, 5, 0%
      - go-certificate-validation-override       # 3, 3, 0%
      - javascript-crypto-certificate-validation # 3, 7, 22%
      - java-tls-bypass                          # 3, 3, 0%
      - javascript-http-client-tls-override      # 3, 3, 0%
      - typescript-http-client-tls-override      # 3, 3, 0%

    # Cleared the rediscovery gate but held back from the first wave.
    # Not deleted: this is the record, and the lane can re-admit a rule
    # from here once scanner_correlation gives it real precision.
    held_back:
      - rule: go-crypto-tls-version
        # 105 of the tranche's 360 novel findings — 29% of its entire
        # triage load from one rule, at an 82% novel rate. Holding it
        # cuts load 1.36 -> 0.61 novel/repo and raises the share of
        # repos seeing nothing from 71% to 84%, at a cost of 23
        # rediscoveries out of 403.
        held: 2026-08-07
        readmit_when: >-
          scanner_correlation gives it a measured precision at or above
          the ~50% gate, or the pattern is tightened upstream.

  adopter-rules:
    enabled: false
    # Relative to this allowlist file, not the scan checkout or process cwd.
    source: ./opengrep-rules
    # Author and validate the entire directory with paired native fixtures,
    # then replace this illustrative ID with your explicitly selected IDs.
    rules:
      - adopter-python-injection-shell
