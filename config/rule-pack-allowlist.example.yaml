# Template for the allowlist `overrides.rule_pack_allowlist` in traust.yaml names (shipped
# default: no supplements). Copy it beside traust.yaml, point the override at it, and edit.
# The harness never reads this example at run time.
#
# Supplemental external opengrep packs, enabled PER RULE.
#
# This file is the switch. `run_opengrep.py` reads it on every default run
# (no explicit --rules), so adding a rule here enables it fleet-wide on the
# next audit, and deleting a line disables it. The /mine-ledger lane
# maintains it: it re-scores every enabled rule against the ~50% precision
# gate each pass and flags demotion candidates.
#
# Why per-rule and never wholesale: argus-observe-rules ships 640 rules of
# which 19 account for 86% of finding volume (~119 novel findings/repo of
# reflection and single-argument .get() matches). Enabling the pack whole
# would bury triage; enabling the calibrated subset costs ~1.4 novel/repo.
#
# Promotion requires the opengrep-ruleset-plan gate. Rediscovery is measured
# pre-flight by python3 -m traust.cli impact calibrate-rule-pack; precision cannot exist until
# a rule has run, so it accrues afterwards from scanner_correlation and is
# re-checked on the lane's cadence.
#
# Failure posture: a pack that cannot be fetched is SKIPPED with a warning
# recorded in the report — an audit never fails because a supplemental pack
# is unreachable, and never silently reports fewer findings without saying
# the pack was missing.

packs:
  argus-observe-rules:
    # Flip to false to disable the whole pack without losing the record.
    enabled: true
    source: https://github.com/smith-xyz/argus-observe-rules@2a94aebee9a26a7e0325582330c4eed232b984fb
    # Calibrated 2026-08-06/07 over 263 crypto targets — record the
    # evidence location for YOUR calibration here.
    # Comments are repos_rediscovered, rediscoveries, novel%.
    rules:
      - go-tls-bypass                            # 42, 110, 34%
      - go-crypto-certificate-validation         # 41, 75, 38%
      - go-http-client-tls-override              # 31, 39, 59%
      - python-certificate-validation-override   # 22, 35, 38%
      - python-tls-bypass                        # 18, 41, 41%
      - python-http-client-tls-override          # 12, 22, 62%
      - python-crypto-certificate-validation     # 8, 9, 25%
      - go-crypto-cipher-modes                   # 4, 17, 26%
      - javascript-tls-bypass                    # 4, 8, 0%
      - typescript-tls-bypass                    # 4, 5, 0%
      - go-certificate-validation-override       # 3, 3, 0%
      - javascript-crypto-certificate-validation # 3, 7, 22%
      - java-tls-bypass                          # 3, 3, 0%
      - javascript-http-client-tls-override      # 3, 3, 0%
      - typescript-http-client-tls-override      # 3, 3, 0%

    # Cleared the rediscovery gate but held back from the first wave.
    # Not deleted: this is the record, and the lane can re-admit a rule
    # from here once scanner_correlation gives it real precision.
    held_back:
      - rule: go-crypto-tls-version
        # 105 of the tranche's 360 novel findings — 29% of its entire
        # triage load from one rule, at an 82% novel rate. Holding it
        # cuts load 1.36 -> 0.61 novel/repo and raises the share of
        # repos seeing nothing from 71% to 84%, at a cost of 23
        # rediscoveries out of 403.
        held: 2026-08-07
        readmit_when: >-
          scanner_correlation gives it a measured precision at or above
          the ~50% gate, or the pattern is tightened upstream.
