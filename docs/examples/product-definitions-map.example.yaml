# Example product map: keep yours in your own repository and record it with
# `traust registry product-map <file>` (each recording is the next version; lookups use the
# newest). The harness never reads this example at run time.
#
# Reviewed findings-package / repo -> ps_product mappings for
# python3 -m traust.cli registry products (consumers: /assign-findings-owners,
# /reassign-findings-owners).
#
# WHY THIS FILE EXISTS
# The product-definitions registry only carries git repo URLs for managed
# services (via ps_update_streams[].managed_service_components), which
# joins ~1% of the audited corpus. Everything else has to be matched by
# name, and a name match is a guess. This file is where a human records
# the guesses that turned out to be right, so they stop being guesses.
#
# MATCH TIERS, highest first:
#   mapped    an entry in the recorded map. Trusted.
#   repo-url  exact managed_service_components[].git_repo_url. Trusted.
#   slug      package name matched a ps_product id/name. ADVISORY ONLY —
#             never feeds an owner decision until confirmed here.
#   none      no match. Not an error; the other ownership sources carry on.
#
# HOW TO ADD AN ENTRY
#   python3 -m traust.cli registry products --all
# proposes a match per package under your findings-packages directory.
# Review each one — check the contacts and lifecycle actually describe the
# product you think it is — then copy the confirmed pairs in below.
#
# The script NEVER writes the map. Every entry is a human assertion.
#
# ps_product ids are immutable by upstream policy (they are foreign keys in
# Flaw/Affect records), so an entry does not rot on a rename.

mappings:
  # <findings-package-name>: <ps_product-id>
  # The -findings suffix is optional; both forms resolve.
  packages: {}
  #  example-operator-findings: example-product
  #  example-service-findings: example-platform

  # <repo-url>: <ps_product-id>
  # Only needed for a repo the registry does not already carry a
  # git_repo_url for — otherwise the repo-url tier finds it unaided.
  repos: {}
