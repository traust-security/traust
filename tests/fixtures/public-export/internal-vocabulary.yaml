# The suite's organization vocabulary (tests/conftest.py points HARNESS_INTERNAL_VOCABULARY
# here): a copy of tools/public-export/internal-vocabulary.example.yaml.
#
# Organization-specific vocabulary for `scan_internal_refs`.
#
# The scanner's UNIVERSAL rules live in code: credential shapes (PEM headers,
# AKIA ids, JWTs), RFC1918 space, cloud account/service-account/project ids,
# Google Drive ids, LDAP-uid-shaped ownership fields. Those are the same
# everywhere and need no configuration.
#
# The rules BELOW are different: their patterns name one organization's hosts,
# tools, trackers and products. That vocabulary is itself disclosure -- a
# scanner shipping a list of an organization's internal tool names has
# published that list. So it lives in your own file, not in the scanner.
#
# THIS FILE IS AN EXAMPLE. Its values use RFC 2606's reserved .invalid TLD and
# obviously-fake tokens, so they can never match a real host -- or this repo's
# own example.com test fixtures, which an earlier draft using example.com did,
# producing 48 phantom hits against the harness itself.
#
# Copy it beside your export tooling, replace the values, and point the
# scanner at it:
#
#     scan_internal_refs --vocabulary path/to/yours.yaml
#     HARNESS_INTERNAL_VOCABULARY=path/to/yours.yaml
#
# A missing or malformed file is a hard error. A scanner quietly running with
# fewer rules than you think reports "clean" for the wrong reason.
#
# Tiers: block = must not ship. review = a human looks. note = context only.
#
# Patterns are Python regex, compiled IGNORECASE unless the pattern opts out
# with (?-i:...). Anchor on shape, not on length: a "long digit run" or
# "28+ chars" rule matches digests, UUIDs and fuzz output, and buries the
# signal in noise.

rules:
  - id: internal-host
    tier: block
    why: internal hostname
    # leading subdomain optional — a bare `internal.yourorg.invalid` in code or
    # prose discloses exactly as much as the full host
    pattern: '\b(?:[a-z0-9][a-z0-9.-]*\.)?(?:corp|internal)\.yourorg\.invalid\b'

  # Case-SIGNIFICANT: a Kerberos realm is uppercase by convention. Compiled
  # IGNORECASE this matches every lowercase occurrence of the domain and
  # produces hundreds of phantom block-tier hits.
  - id: kerberos-realm
    tier: block
    why: Kerberos realm
    pattern: '(?-i:\b[A-Z0-9.-]+\.YOURORG\.INVALID\b)'

  - id: vault-path
    tier: block
    why: secret-store path
    pattern: '\byourorg-secrets/[A-Za-z0-9/_-]+\b'

  - id: internal-gitlab
    tier: review
    why: internal forge host
    pattern: 'gitlab\.internal\.yourorg\.invalid'

  - id: org-email
    tier: review
    why: organization email — some are published aliases, most are people
    pattern: '\b[A-Za-z0-9._%+-]+@yourorg\.invalid\b'

  - id: jira-internal
    tier: review
    why: internal tracker key
    pattern: '\b(?:YOURPROJ|YOURSEC)-\d+\b'

  # The tool names an organization runs internally. This is the list that must
  # not ship compiled into the scanner.
  - id: internal-tooling
    tier: review
    why: internal tooling/process vocabulary
    pattern: '\b(?:yourorg-build-tool|yourorg-deploy-tool)\b'

  - id: campaign
    tier: review
    why: campaign codename
    pattern: '\b(?:Yourorg-Campaign|ProjectYourorgCampaign)\b'

  # note tier: fine to ship, listed so a reader sees the public surface too.
  - id: org-public
    tier: note
    why: public endpoint — fine to ship, listed for context
    pattern: '\b(?:docs|www)\.yourorg\.invalid\b'

  - id: org-product
    tier: note
    why: product vocabulary
    pattern: '\b(?:YourorgProduct|YourorgSuite)\b'
