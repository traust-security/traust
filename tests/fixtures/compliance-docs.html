<section class="section" id="system-wide-crypto-policies_using-the-system-wide-cryptographic-policies"><h3 class="title"><a href="#system-wide-crypto-policies_using-the-system-wide-cryptographic-policies" class="anchor-heading test-horse">4.1.&nbsp;System-wide cryptographic policies</a></h3><p class="_abstract _abstract">
The RHEL system-wide cryptographic policies configure core subsystems, such as TLS and SSH, which ensures that applications reject weak algorithms by default. The four predefined policies are <code class="literal">DEFAULT</code>, <code class="literal">LEGACY</code>, <code class="literal">FUTURE</code>, and <code class="literal">FIPS</code>.
</p></section>
