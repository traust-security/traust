name: ops-smoke

# Manual integrity gate, not push/PR CI. Checkout and tool provisioning may
# need network; every workload input is local. Never pass a forge/model token
# to the smoke. Pin disagreement or incomplete replay evidence is a failure.

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: traust
    env:
      UV_LOCKED: "1"
      OPS_ENGINE_CHECKOUT: ../traust-engine
      OPS_SDK_CHECKOUT: ../traust-sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: traust
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: traust-security/traust-engine
          persist-credentials: false
          ref: 4be1c3a28f9361c030bd0df3f506cfc00eeaf357
          path: traust-engine
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: traust-security/traust-sdk
          ref: d1af83285a6ac6f1bbbcb44bd3fe350717ea6a80
          path: traust-sdk
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Reject dirty, skewed or unpublished candidates before provisioning
        run: python3 scripts/check_ops_pins.py --preflight
      - name: Install pinned smoke tools
        run: |
          uv sync --locked --quiet
          HARNESS_BIN_DIR="$RUNNER_TEMP/bin" bash scripts/install-toolchain.sh local-ops
          HARNESS_BIN_DIR="$RUNNER_TEMP/bin" bash scripts/install-toolchain.sh ledger-signing
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Require installed pins, SDK/Core recording proofs and signed rig replay
        run: make ops-smoke
