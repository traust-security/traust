name: ops-smoke

# The local continuous-ops rig, end to end: make ops-smoke stands up an
# ephemeral Postgres, onboards one repository, runs one engine pass, claims
# until the queue drains and asserts the orders completed (see
# docs/continuous-operations.md, "The local rig"). Manual only: routed lanes
# queue for approval and are never claimed here, so the run spends nothing.
#
# NOT CI (decided 2026-11-04): the engine runs and collects real data — it
# never runs on push or pull_request, and this workflow stays
# workflow_dispatch-only as a manual full-rig check. The rig on a laptop is
# the integration test; CI unit-tests and integration-tests the pieces.
# GitHub registers a workflow only when it exists on the default branch, so
# dispatch may 404 until this file reaches main — run the same check locally
# with make ops-smoke.

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: traust-security/traust-engine
          ref: 779471df5b9473bbf31cf0ad78d213f88bda9153
          path: traust-engine
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install pinned Syft for manifest SBOM smoke
        run: |
          uv sync --quiet
          HARNESS_BIN_DIR="$RUNNER_TEMP/bin" bash scripts/install-toolchain.sh local-ops
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: make ops-smoke
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPS_ENGINE_SRC: ${{ github.workspace }}/traust-engine
          OPS_TEARDOWN: "1"
