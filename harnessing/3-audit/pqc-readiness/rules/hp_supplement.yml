# PQC supplement rule pack (v1)
# Complements the vendored pqc-scan default rules (pinned be5c760a).
# Core's native prescan combines the source scanner with its provider/toolchain/
# policy census and material checks; this pack supplies source + config regex.

# ---- HP-EC: non-RSA Shor-vulnerable APIs -----------------------------------
- id: HP_EC_GO_ECDSA
  kind: regex
  category: CryptoAPI
  severity: high
  risk: quantum-vulnerable
  confidence: 0.85
  migration_hint: Plan migration of ECDSA signatures to ML-DSA (FIPS 204).
  pattern: '\becdsa\.(GenerateKey|Sign|SignASN1|Verify|VerifyASN1)\b'
  scope: code
  description: Go crypto/ecdsa usage (quantum-vulnerable signatures).

- id: HP_EC_GO_ECDH_X25519
  kind: regex
  category: CryptoAPI
  severity: high
  risk: quantum-vulnerable
  confidence: 0.85
  migration_hint: Key establishment must move to ML-KEM or hybrid (X25519MLKEM768).
  pattern: '\becdh\.(P256|P384|P521|X25519)\b|\bx25519\.(X25519|ScalarMult)\b|\bcurve25519\.'
  scope: code
  description: Go ECDH/X25519 key-establishment usage.

- id: HP_EC_GO_ED25519_SIGN
  kind: regex
  category: CryptoAPI
  severity: medium
  risk: quantum-vulnerable
  confidence: 0.8
  migration_hint: EdDSA signatures are disallowed after 2035; plan ML-DSA/SLH-DSA.
  pattern: '\bed25519\.(GenerateKey|Sign)\b'
  scope: code
  description: Go Ed25519 signature generation.

- id: HP_EC_JAVA_EC
  kind: regex
  category: CryptoAPI
  severity: high
  risk: quantum-vulnerable
  confidence: 0.8
  migration_hint: Migrate EC key agreement/signatures to ML-KEM/ML-DSA (JDK 24+).
  pattern: 'KeyPairGenerator\.getInstance\(\s*"(EC|ECDSA|ECDH|XDH|Ed25519|EdDSA|DH|DiffieHellman)"|KeyAgreement\.getInstance\(\s*"(ECDH|XDH|DH|DiffieHellman)"|Signature\.getInstance\(\s*"[A-Za-z0-9]*withECDSA"'
  scope: code
  description: Java EC/DH key agreement or ECDSA signature usage.

- id: HP_EC_PY_EC
  kind: regex
  category: CryptoAPI
  severity: high
  risk: quantum-vulnerable
  confidence: 0.8
  migration_hint: Migrate to ML-KEM/ML-DSA via a PQC-capable provider.
  pattern: '\bec\.generate_private_key\b|\bec\.ECDH\(|\bec\.ECDSA\(|\bX25519PrivateKey\b|\bEd25519PrivateKey\b|\bdh\.generate_parameters\b'
  scope: code
  description: Python cryptography EC/DH/X25519/Ed25519 usage.

- id: HP_EC_NODE_EC
  kind: regex
  category: CryptoAPI
  severity: high
  risk: quantum-vulnerable
  confidence: 0.75
  migration_hint: Migrate to ML-KEM/ML-DSA when Node exposes PQC primitives.
  pattern: 'generateKeyPair(Sync)?\(\s*[\x27"](ec|ed25519|x25519|dh)[\x27"]|createECDH\('
  scope: code
  description: Node.js EC/DH/Ed25519/X25519 key generation.

- id: HP_EC_RUST_EC
  kind: regex
  category: CryptoAPI
  severity: medium
  risk: quantum-vulnerable
  confidence: 0.7
  migration_hint: Track PQC support in ring/rustls; plan hybrid KE.
  pattern: '\bp256::|\bp384::|\bed25519_dalek::|\bx25519_dalek::|EphemeralPrivateKey::generate|agreement::(ECDH_P256|ECDH_P384|X25519)'
  scope: code
  description: Rust EC/X25519 crypto crate usage.

# ---- HP-C: C/C++ OpenSSL APIs (EVP vs low-level) ---------------------------
- id: HP_C_OPENSSL_LOWLEVEL
  kind: regex
  category: CryptoAPI
  severity: high
  risk: quantum-vulnerable
  confidence: 0.85
  migration_hint: >-
    Low-level OpenSSL APIs bypass providers and cannot inherit PQC; refactor
    to EVP_* (deprecated since OpenSSL 3.0) before any algorithm migration.
  pattern: '\b(RSA_generate_key(_ex)?|RSA_new|RSA_public_encrypt|RSA_private_decrypt|RSA_sign|RSA_verify|EC_KEY_new(_by_curve_name)?|EC_KEY_generate_key|ECDSA_do_sign|ECDSA_sign|ECDH_compute_key|DH_new|DH_generate_key|DSA_generate_key)\b'
  scope: code
  description: OpenSSL low-level (provider-bypassing) asymmetric API usage — crypto-agility blocker.

- id: HP_C_OPENSSL_EVP_ASYM
  kind: regex
  category: CryptoAPI
  severity: medium
  risk: quantum-vulnerable
  confidence: 0.7
  migration_hint: EVP users inherit provider algorithms; readiness follows the linked OpenSSL version.
  pattern: '\bEVP_PKEY_(keygen|derive|encrypt|decrypt|sign|verify)(_init)?\b|EVP_PKEY_CTX_new_id\(\s*EVP_PKEY_(RSA|EC|DH|DHX|X25519|ED25519)'
  scope: code
  description: OpenSSL EVP asymmetric usage (provider-agile).

# ---- HP-GROUPS: TLS 1.3 group / KEX pins (the hybrid-KEM blockers) ---------
- id: HP_GROUPS_GO_CURVEPREFERENCES
  kind: regex
  category: TLS
  severity: high
  risk: quantum-vulnerable
  confidence: 0.85
  migration_hint: >-
    Literal CurvePreferences without X25519MLKEM768 blocks Go's default hybrid
    key exchange (Go >= 1.24). Remove the pin or include the MLKEM group.
  pattern: 'CurvePreferences\s*:\s*\[\]'
  scope: code
  description: Go tls.Config CurvePreferences pin (blocks hybrid ML-KEM unless MLKEM group included).

- id: HP_GROUPS_NGINX_ECDH_CURVE
  kind: regex
  category: TLS
  severity: high
  risk: quantum-vulnerable
  confidence: 0.85
  migration_hint: ssl_ecdh_curve pins TLS 1.3 groups; include hybrid MLKEM groups or remove.
  pattern: '(?m)^\s*ssl_ecdh_curve\s+'
  scope: config
  description: nginx ssl_ecdh_curve directive (TLS group pin).

- id: HP_GROUPS_HTTPD_OPENSSLCONF
  kind: regex
  category: TLS
  severity: high
  risk: quantum-vulnerable
  confidence: 0.8
  migration_hint: SSLOpenSSLConfCmd Curves/Groups pins TLS 1.3 groups.
  pattern: 'SSLOpenSSLConfCmd\s+(Curves|Groups)\s+'
  scope: config
  description: Apache httpd TLS group pin.

- id: HP_GROUPS_HAPROXY_CURVES
  kind: regex
  category: TLS
  severity: high
  risk: quantum-vulnerable
  confidence: 0.8
  migration_hint: HAProxy curves/ecdhe pins TLS groups; include hybrid groups or remove.
  pattern: '(?m)^\s*(ssl-default-bind-curves|curves)\s+|\becdhe\s+'
  scope: config
  description: HAProxy TLS group pin.

- id: HP_GROUPS_ENVOY_ECDH
  kind: regex
  category: TLS
  severity: high
  risk: quantum-vulnerable
  confidence: 0.8
  migration_hint: Envoy ecdh_curves pins TLS groups; include hybrid groups or remove.
  pattern: 'ecdh_curves\s*:'
  scope: config
  description: Envoy/Istio TLS group pin.

- id: HP_GROUPS_OPENSSL_CNF
  kind: regex
  category: TLS
  severity: high
  risk: quantum-vulnerable
  confidence: 0.75
  migration_hint: openssl.cnf Groups/Curves pins affect every linked consumer.
  pattern: '(?m)^\s*(Groups|Curves)\s*=\s*'
  scope: config
  description: openssl.cnf system-wide TLS group pin.

- id: HP_GROUPS_JAVA_NAMEDGROUPS
  kind: regex
  category: TLS
  severity: high
  risk: quantum-vulnerable
  confidence: 0.85
  migration_hint: jdk.tls.namedGroups pins TLS groups; include ML-KEM groups (JDK 24+) or remove.
  pattern: 'jdk\.tls\.namedGroups'
  scope: code
  description: Java TLS named-groups pin.

- id: HP_GROUPS_SSHD_KEX
  kind: regex
  category: SSH
  severity: medium
  risk: quantum-vulnerable
  confidence: 0.8
  migration_hint: KexAlgorithms pins block PQC kex (sntrup761x25519 / mlkem768x25519).
  pattern: '(?mi)^\s*KexAlgorithms\s+'
  scope: config
  description: sshd/ssh KexAlgorithms pin.

# ---- HP-SIGN: artifact/code-signing infrastructure -------------------------
- id: HP_SIGN_COSIGN
  kind: regex
  category: Signing
  severity: medium
  risk: quantum-vulnerable
  confidence: 0.75
  migration_hint: >-
    cosign/sigstore signatures are ECDSA-based; multi-year verification
    lifetimes make release signing HNDL-relevant. Track sigstore PQC roadmap.
  pattern: '\bcosign\s+(sign|attest|verify|sign-blob|generate-key-pair)\b|sigstore/(cosign|rekor|fulcio|sigstore-go)|chains\.tekton\.dev|tektoncd/chains'
  scope: code
  description: Sigstore/cosign artifact-signing usage.

- id: HP_SIGN_GPG
  kind: regex
  category: Signing
  severity: low
  risk: quantum-vulnerable
  confidence: 0.6
  migration_hint: GPG RSA/DSA signing keys are quantum-vulnerable; long-lived artifact signatures are HNDL-class.
  pattern: '\bgpg2?\s+(--detach-sign|--sign|--clearsign)\b|rpm\s+--addsign|%_gpg_name'
  scope: code
  description: GPG/RPM artifact signing.

# ---- HP-PQC: positive adoption signals --------------------------------------
- id: HP_PQC_ADOPTION
  kind: regex
  category: PQC
  severity: info
  risk: quantum-safe
  confidence: 0.9
  migration_hint: Record parameter set and security category (1/3/5) in the CBOM.
  pattern: '(?i)\b(ml-?kem(512|768|1024)?|kyber|ml-?dsa|dilithium|slh-?dsa|sphincs\+?|falcon-?(512|1024)|\bhqc\b|liboqs|oqs-?provider|X25519MLKEM768|mlkem768x25519)\b'
  scope: code
  description: Post-quantum algorithm/library adoption signal.

- id: HP_PQC_HBS
  kind: regex
  category: PQC
  severity: info
  risk: quantum-safe
  confidence: 0.7
  migration_hint: SP 800-208 hash-based signatures are approved; verify stateful-key management.
  pattern: '(?i)\b(xmss(mt)?|\blms\b|\bhss\b)\b'
  scope: code
  description: Hash-based signature (LMS/HSS/XMSS) usage signal.

# ---- HP-HASH: classically-broken primitives in code -------------------------
- id: HP_HASH_BROKEN_GO
  kind: regex
  category: Hash
  severity: medium
  risk: non-quantum-risk
  confidence: 0.7
  migration_hint: MD5/SHA-1/DES/RC4 are classically broken/disallowed; replace regardless of PQC.
  pattern: '\b(crypto/)?(md5|sha1|des|rc4)\.(New|Sum|NewCipher|NewTripleDESCipher)\b'
  scope: code
  description: Go broken-primitive usage (context adjudication required).

- id: HP_HASH_BROKEN_GENERIC
  kind: regex
  category: Hash
  severity: medium
  risk: non-quantum-risk
  confidence: 0.6
  migration_hint: Replace MD5/SHA-1 in any security context; 3DES is disallowed after 2030.
  pattern: 'MessageDigest\.getInstance\(\s*"(MD5|SHA-?1)"|hashlib\.(md5|sha1)\(|createHash\(\s*[\x27"](md5|sha1)[\x27"]|OpenSSL::Digest::(MD5|SHA1)|\bDES-?EDE3?\b|3DES'
  scope: code
  description: Cross-language MD5/SHA-1/3DES usage (context adjudication required).

