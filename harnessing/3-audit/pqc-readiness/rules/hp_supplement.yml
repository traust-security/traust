- id: HP_DB_CEPH_MSGR2_CRC
  kind: regex
  category: TLSConfig
  severity: medium
  risk: non-quantum-risk
  confidence: 0.8
  migration_hint: msgr2 crc mode is cleartext on the wire; secure mode prerequisite for any PQC transport.
  pattern: 'ms_(cluster|service|client|mon_cluster|mon_service|mon_client)_mode\s*[:=]\s*crc'
  scope: code
  description: Ceph messenger v2 cleartext (crc) mode.

- id: HP_DYN_JWT_HS_SHORT_SECRET
  kind: regex
  category: CryptoAPI
  severity: medium
  risk: non-quantum-risk
  confidence: 0.5
  migration_hint: Short HMAC secrets are brute-forceable classically; adjudicate secret provenance.
  pattern: 'jwt\.sign\([^,\n]+,\s*[''"][^''"]{1,15}[''"]'
  scope: code
  description: JWT HS-family signing with short inline secret (low-confidence, adjudicated).

