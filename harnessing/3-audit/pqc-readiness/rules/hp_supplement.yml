# ---- First-party TLS listener census ----------------------------------------
# Ownership anchors for the who-sets-tls walk: a repo that terminates TLS
# in-process owns that decision point. Without these facts a first-party TLS
# server with no vulnerable tokens is invisible and the walk falls through to
# language_defaults.

- id: HP_TLS_LISTENER_GO
  kind: regex
  category: TLSConfig
  severity: info
  risk: non-quantum-risk
  confidence: 0.85
  migration_hint: First-party TLS server — on platforms with a managed TLS profile, verify this listener consumes it (static config = profile non-adherence).
  pattern: '\b(ListenAndServeTLS|ServeTLS)\s*\(|\btls\.(Listen|NewListener)\s*\('
  scope: code
  description: Go TLS listener — the app terminates TLS in-process.

- id: HP_TLS_SERVER_CONFIG_GO
  kind: regex
  category: TLSConfig
  severity: info
  risk: non-quantum-risk
  confidence: 0.75
  migration_hint: Server TLS config constructed in code — check whether it derives from the platform TLS profile or pins a static posture.
  pattern: '\bTLSConfig\s*:\s*&?[A-Za-z_]|\bSecureTLSConfig\s*\(|\bGetTLSOptions\s*\(|\bTLSOpts\s*:'
  scope: code
  description: Go server TLS configuration construction site.

- id: HP_TLS_LISTENER_PY
  kind: regex
  category: TLSConfig
  severity: info
  risk: non-quantum-risk
  confidence: 0.75
  migration_hint: First-party TLS server — verify it follows the platform TLS profile where one exists.
  pattern: 'ssl\.SSLContext\s*\(\s*ssl\.PROTOCOL_TLS_SERVER|wrap_socket\s*\([^)]*server_side\s*=\s*True'
  scope: code
  description: Python TLS listener — the app terminates TLS in-process.

- id: HP_TLS_LISTENER_JS
  kind: regex
  category: TLSConfig
  severity: info
  risk: non-quantum-risk
  confidence: 0.75
  migration_hint: First-party TLS server — verify it follows the platform TLS profile where one exists.
  pattern: 'https\.createServer\s*\(|tls\.createServer\s*\('
  scope: code
  description: Node TLS listener — the app terminates TLS in-process.

- id: HP_TLS_LISTENER_RUST
  kind: regex
  category: TLSConfig
  severity: info
  risk: non-quantum-risk
  confidence: 0.75
  migration_hint: First-party TLS server — verify it follows the platform TLS profile where one exists (openssl/native-tls acceptors preferred over rustls for FIPS).
  pattern: '\b(TlsAcceptor|SslAcceptor)\b|\brustls::ServerConfig\b|ServerConfig::builder\s*\(|\bbind_(rustls|openssl)\s*\('
  scope: code
  description: Rust TLS listener/acceptor — the app terminates TLS in-process (native-tls, openssl, or rustls backend).

# ---- Additional security patterns -------------------------------------------

- id: HP_TLS_VERIFY_DISABLED_GO
  kind: regex
  category: TLSConfig
  severity: medium
  risk: non-quantum-risk
  confidence: 0.85
  migration_hint: TLS verification disabled defeats classical AND PQC transport security.
  pattern: 'InsecureSkipVerify\s*:\s*true'
  scope: code
  description: Go TLS certificate verification disabled.

- id: HP_TLS_VERIFY_DISABLED_JS
  kind: regex
  category: TLSConfig
  severity: medium
  risk: non-quantum-risk
  confidence: 0.85
  migration_hint: Re-enable certificate verification before any PQC transport claim.
  pattern: 'rejectUnauthorized\s*:\s*false|NODE_TLS_REJECT_UNAUTHORIZED\s*=\s*.?0'
  scope: code
  description: Node TLS certificate verification disabled.

- id: HP_TLS_VERIFY_DISABLED_PY
  kind: regex
  category: TLSConfig
  severity: medium
  risk: non-quantum-risk
  confidence: 0.8
  migration_hint: Re-enable certificate verification before any PQC transport claim.
  pattern: 'verify\s*=\s*False|ssl\._create_unverified_context|CERT_NONE'
  scope: code
  description: Python TLS certificate verification disabled.

- id: HP_TLS_VERIFY_DISABLED_CONF
  kind: regex
  category: TLSConfig
  severity: medium
  risk: non-quantum-risk
  confidence: 0.8
  migration_hint: Re-enable certificate verification before any PQC transport claim.
  pattern: 'ssl_verify\s*[:=]\s*(false|none)|sslverify\s*[:=]\s*(0|false)|insecure-skip-tls-verify\s*[:=]\s*true'
  scope: code
  description: Config-level TLS verification disabled.

- id: HP_HASH_UNAUTH_CIPHER_MODE
  kind: regex
  category: CryptoAPI
  severity: medium
  risk: non-quantum-risk
  confidence: 0.75
  migration_hint: ECB (and MAC-less CBC) are broken independent of the quantum timeline.
  pattern: 'MODE_ECB|/ECB/|\bNewECBEncrypter\b|EVP_aes_\d+_ecb\b|AES/ECB'
  scope: code
  description: Unauthenticated/ECB cipher mode usage.

- id: HP_SEC_SECRET_EMBED
  kind: regex
  category: KeyMaterial
  severity: medium
  risk: non-quantum-risk
  confidence: 0.55
  migration_hint: Embedded signing/session secrets defeat rotation; adjudicate context.
  pattern: 'SECRET_KEY_BASE\s*[:=]\s*[0-9a-fA-F]{16,}|secret_key_base:\s*[0-9a-f]{16,}'
  scope: code
  description: Embedded session/signing secret (low-confidence, adjudicated).

- id: HP_CLI_OPENSSL_ENC_STATIC_KEY
  kind: regex
  category: CLI
  severity: medium
  risk: quantum-uncertain
  confidence: 0.7
  migration_hint: openssl enc with inline key/passphrase; adjudicate key management.
  pattern: 'openssl\s+enc\b[^\n]*(-K\s+[0-9A-Fa-f]+|-pass\s)'
  scope: code
  description: openssl enc CLI with static key material.

- id: HP_NET_PLAINTEXT_FETCH
  kind: regex
  category: TLSConfig
  severity: low
  risk: non-quantum-risk
  confidence: 0.6
  migration_hint: Plaintext fetch in build/runtime path; no transport security of any kind.
  pattern: '\b(curl|wget)\s+(-[\w-]+\s+)*http://[^\s''"]+'
  scope: code
  description: Plaintext HTTP fetch in scripts/build files.

- id: HP_EC_PY_RSA_KEYGEN
  kind: regex
  category: CryptoAPI
  severity: high
  risk: quantum-vulnerable
  confidence: 0.85
  migration_hint: RSA keygen is Shor-vulnerable; plan ML-KEM/ML-DSA via provider.
